log_config:
  name: aihr
  log_level_console: INFO     # 控制台输出级别；INFO 过滤 DEBUG 噪音（健康检查等）
  log_level_file: DEBUG       # debug 目录文件输出级别；通常保持 DEBUG
  log_folder: ../logs
  log_pid: ""                 # 可选服务标识；文件名始终追加实际进程 PID，避免多 worker 冲突
  max_bytes: 52428800         # 单文件大小上限（50 MB）；超出立即轮转；0 表示不限
  to_console: true
  use_queue: false            # true 时仅在当前进程内使用 QueueListener 异步落盘
  json_format: false          # true = 单行 JSON；false = 彩色文本（Docker 控制台也带 ANSI）
