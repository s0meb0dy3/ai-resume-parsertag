services:
  ai-resume-parsertag:
    build: .
    image: ai-resume-parsertag:v3.1.0-20260629
    container_name: ai-resume-parsertag
    restart: unless-stopped
    ports:
      - "21804:21804"
    env_file: .env
    volumes:
      - ./logs:/app/logs
      - ./uploads:/app/uploads
      - ./results:/app/results
      - ./schemas:/app/schemas
      - ./runtime:/app/runtime
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:21804/health')"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
